name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo test -p openhop-core
      - run: cargo build --release -p openhop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: openhop-cli-${{ runner.os }}
          path: |
            target/release/openhop
            target/release/openhop.exe
          if-no-files-found: ignore

  bundle:
    name: Installer (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            out: target/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            out: target/release/bundle
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            out: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Build installers
        working-directory: app
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHop-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, bundle]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else
            TAG="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          pattern: OpenHop-*
          path: dist
          merge-multiple: true
      - name: Publish ${{ steps.ver.outputs.tag }}
        if: steps.ver.outputs.exists == 'false'
        run: |
          find dist -type f | sort
          cat > notes.md <<'EOF'
          ## Install

          **Windows** (PowerShell)
          ```powershell
          irm https://raw.githubusercontent.com/maykano-dev/open-hop/main/scripts/install.ps1 | iex
          ```

          **macOS / Linux** (Terminal)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/maykano-dev/open-hop/main/scripts/install.sh | bash
          ```

          Or download the file for your computer below:

          | Computer | File |
          |---|---|
          | Windows 10 / 11 | `…_x64-setup.exe` (or `.msi`) |
          | macOS (Apple Silicon & Intel) | `…_universal.dmg` |
          | Ubuntu / Debian / Mint | `…_amd64.deb` |
          | Fedora / openSUSE | `….x86_64.rpm` |
          | Other Linux | `…_amd64.AppImage` |

          Then see [Set up your computers](https://github.com/maykano-dev/open-hop#set-up-your-computers).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" --title "OpenHop ${{ steps.ver.outputs.tag }}" --notes-file notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
