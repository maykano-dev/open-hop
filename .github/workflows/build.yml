name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo test -p openhop-core
      - run: cargo build --release -p openhop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: openhop-cli-${{ runner.os }}
          path: |
            target/release/openhop
            target/release/openhop.exe
          if-no-files-found: ignore

  bundle:
    name: Installer (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            out: target/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            out: target/release/bundle
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            out: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Build installers
        working-directory: app
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHop-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/dmg/*.dmg
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          files: |
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/dmg/*.dmg
