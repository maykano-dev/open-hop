# Publishes the website (site/) and the phone app (web/phone, at /phone/) to
# the gh-pages branch, which GitHub Pages serves over HTTPS at
# https://<owner>.github.io/open-hop/.
name: Website and phone app
on:
  push:
    branches: [main]
    paths: ["web/phone/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to gh-pages
        run: |
          mkdir -p out
          cp -r site/. out/
          mkdir -p out/phone
          cp -r web/phone/. out/phone/
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Phone app from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
