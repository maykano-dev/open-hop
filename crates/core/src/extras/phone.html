<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenHop">
<title>OpenHop · {{NAME}}</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --label: #000; --secondary: rgba(60,60,67,.6);
    --fill: rgba(118,118,128,.12); --sep: rgba(60,60,67,.18); --blue: #007aff; --green: #34c759; --red: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6);
      --fill: rgba(118,118,128,.24); --sep: rgba(84,84,88,.6); --blue: #0a84ff; --green: #30d158; --red: #ff453a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  .notch { margin: 0 auto 26px; width: max-content; max-width: 100%; background: #000; color: #fff; border-radius: 20px;
    padding: 9px 16px 9px 12px; display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #30d158; box-shadow: 0 0 0 3px rgba(48,209,88,.25); flex: none; }
  .dot.off { background: #ff9f0a; box-shadow: 0 0 0 3px rgba(255,159,10,.25); }
  .notch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 6px; }
  .sub { color: var(--secondary); margin: 0 0 18px; font-size: 15px; }
  .send { display: block; position: relative; border-radius: 22px; background: var(--card); padding: 22px 20px; text-align: center; }
  .send input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .big { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--blue); color: #fff;
    border-radius: 14px; padding: 15px 22px; font-weight: 600; width: 100%; font-size: 17px; }
  .send small { display: block; margin-top: 10px; color: var(--secondary); font-size: 13px; }
  section { margin-top: 28px; }
  h2 { font-size: 13px; font-weight: 400; color: var(--secondary); margin: 0 0 7px 16px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 58px; color: inherit; text-decoration: none; }
  .row + .row { border-top: .5px solid var(--sep); margin-left: 0; }
  .ic { width: 36px; height: 36px; border-radius: 9px; background: var(--fill); display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; color: var(--secondary); }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta i { font-style: normal; color: var(--secondary); font-size: 13px; }
  .ring { width: 28px; height: 28px; flex: none; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .t { stroke: var(--fill); }
  .ring .p { stroke: var(--blue); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .2s; }
  .ok { color: var(--green); font-weight: 600; font-size: 15px; }
  .bad { color: var(--red); font-size: 15px; }
  .get { color: var(--blue); font-weight: 600; font-size: 15px; }
  .empty { padding: 16px; color: var(--secondary); font-size: 15px; }
  textarea { width: 100%; border: 0; border-radius: 14px; background: var(--card); color: inherit; font: inherit; padding: 13px 14px; min-height: 84px; resize: vertical; outline: none; }
  .tbtn { margin-top: 8px; border: 0; background: var(--fill); color: var(--blue); font: inherit; font-weight: 600; border-radius: 12px; padding: 11px 16px; width: 100%; }
  .tbtn:disabled { color: var(--secondary); }
  .hint { color: var(--secondary); font-size: 13px; margin: 18px 16px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="notch"><i class="dot" id="dot"></i><span id="where">{{NAME}}</span></div>
  <h1>Send to {{NAME}}</h1>
  <p class="sub">Photos, videos and files go to its Downloads folder, in OpenHop.</p>
  <label class="send">
    <span class="big">Choose photos or files</span>
    <small>Several at once is fine.</small>
    <input type="file" id="pick" multiple>
  </label>

  <section id="upsec" hidden>
    <h2>Sending</h2>
    <div class="list" id="ups"></div>
  </section>

  <section>
    <h2>From {{NAME}}</h2>
    <div class="list" id="gets"><div class="empty">Drop files on “Phone” in the OpenHop island and they show up here.</div></div>
  </section>

  <section>
    <h2>Text</h2>
    <textarea id="text" placeholder="Type or paste — it’s copied on {{NAME}}"></textarea>
    <button class="tbtn" id="tsend" disabled>Copy on {{NAME}}</button>
  </section>

  <p class="hint">Keep this page open while you send. Add it to your home screen to come back without the QR code.</p>
</main>
<script>
(function () {
  var base = location.pathname.replace(/\/?$/, "/");
  var $ = function (id) { return document.getElementById(id); };
  function size(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }
  function ext(name) { var m = /\.([a-z0-9]{1,4})$/i.exec(name); return m ? m[1].toUpperCase() : "FILE"; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ring() {
    var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 28 28"); s.setAttribute("class", "ring");
    ["t", "p"].forEach(function (c) { var k = document.createElementNS(ns, "circle"); k.setAttribute("cx", 14); k.setAttribute("cy", 14); k.setAttribute("r", 11); k.setAttribute("class", c); s.appendChild(k); });
    var p = s.lastChild, len = 2 * Math.PI * 11; p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    s.set = function (f) { p.style.strokeDashoffset = len * (1 - f); };
    return s;
  }
  function row(name, sub) {
    var r = el("div", "row"), m = el("div", "meta");
    r.appendChild(el("div", "ic", ext(name)));
    m.appendChild(el("b", null, name)); m.appendChild(el("i", null, sub));
    r.appendChild(m); r.meta = m;
    return r;
  }

  // Sending, one file after another.
  var queue = [], busy = false;
  $("pick").addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    $("upsec").hidden = false;
    files.forEach(function (f) {
      var r = row(f.name, size(f.size)), g = ring();
      r.appendChild(g); $("ups").insertBefore(r, $("ups").firstChild);
      queue.push({ f: f, r: r, g: g });
    });
    next();
  });
  function next() {
    if (busy || !queue.length) return;
    busy = true;
    var job = queue.shift(), x = new XMLHttpRequest();
    x.open("PUT", base + "up?name=" + encodeURIComponent(job.f.name));
    x.upload.onprogress = function (e) { if (e.lengthComputable) job.g.set(e.loaded / e.total); };
    x.onload = function () { done(job, x.status === 200); };
    x.onerror = x.onabort = function () { done(job, false); };
    x.send(job.f);
  }
  function done(job, ok) {
    job.g.remove();
    job.r.appendChild(el("span", ok ? "ok" : "bad", ok ? "Sent" : "Didn’t send"));
    busy = false; next();
  }

  // Files offered by the computer.
  var lastKey = "";
  function poll() {
    var x = new XMLHttpRequest();
    x.open("GET", base + "list");
    x.timeout = 5000;
    x.onload = function () {
      $("dot").className = "dot";
      if (x.status !== 200) return;
      var list = []; try { list = JSON.parse(x.responseText); } catch (e) {}
      var key = list.map(function (o) { return o.id; }).join(",");
      if (key === lastKey) return;
      lastKey = key;
      var box = $("gets"); box.textContent = "";
      if (!list.length) { box.appendChild(el("div", "empty", "Drop files on “Phone” in the OpenHop island and they show up here.")); return; }
      list.forEach(function (o) {
        var r = row(o.name, size(o.size)), a = el("a", "row");
        a.href = base + "dl/" + o.id; a.setAttribute("download", o.name);
        while (r.firstChild) a.appendChild(r.firstChild);
        a.appendChild(el("span", "get", "Get"));
        box.appendChild(a);
      });
    };
    x.onerror = x.ontimeout = function () { $("dot").className = "dot off"; };
    x.send();
  }
  poll(); setInterval(poll, 2500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });

  // Text for the computer's clipboard.
  $("text").addEventListener("input", function () { $("tsend").disabled = !$("text").value; $("tsend").textContent = "Copy on " + $("where").textContent; });
  $("tsend").addEventListener("click", function () {
    var x = new XMLHttpRequest(), b = $("tsend");
    x.open("POST", base + "text");
    x.onload = function () { b.textContent = x.status === 200 ? "Copied" : "Didn’t send"; if (x.status === 200) $("text").value = ""; b.disabled = true; };
    x.onerror = function () { b.textContent = "Didn’t send"; };
    x.send($("text").value);
  });
})();
</script>
</body>
</html>
