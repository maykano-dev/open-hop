<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenHop Windows</title>
  <style>
    :root {
      --glass: rgba(246, 246, 248, 0.86); --label: #000; --secondary: rgba(60, 60, 67, 0.62);
      --line: rgba(60, 60, 67, 0.14); --tile: rgba(255, 255, 255, 0.7); --tile-hover: #fff; --blue: #007aff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Ubuntu, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --glass: rgba(36, 36, 38, 0.86); --label: #fff; --secondary: rgba(235, 235, 245, 0.6); --line: rgba(84, 84, 88, 0.55); --tile: rgba(72, 72, 74, 0.55); --tile-hover: rgba(99, 99, 102, 0.75); }
    }
    :root[data-theme="dark"] { --glass: rgba(36, 36, 38, 0.86); --label: #fff; --secondary: rgba(235, 235, 245, 0.6); --line: rgba(84, 84, 88, 0.55); --tile: rgba(72, 72, 74, 0.55); --tile-hover: rgba(99, 99, 102, 0.75); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--label); }
    .dock {
      position: absolute; inset: 8px; border-radius: 26px; background: var(--glass);
      backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
      box-shadow: 0 0 0 0.5px var(--line), 0 18px 50px rgba(0, 0, 0, 0.28);
      display: flex; flex-direction: column; padding: 10px 14px 8px; animation: up .3s cubic-bezier(.2, .9, .3, 1.12);
    }
    @keyframes up { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    .rows { flex: 1; display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; align-items: stretch; }
    .rows::-webkit-scrollbar { display: none; }
    .computer { display: flex; flex-direction: column; gap: 6px; flex: none; }
    .computer + .computer { padding-left: 14px; border-left: 0.5px solid var(--line); }
    .who { font-size: 11px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .who b { color: var(--blue); }
    .tiles { display: flex; gap: 8px; }
    .tile {
      width: 112px; height: 92px; border: 0; border-radius: 16px; background: var(--tile); color: inherit; font: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 8px; cursor: pointer;
      transition: transform .14s ease, background .14s ease; outline: none;
    }
    .tile:hover, .tile:focus-visible { background: var(--tile-hover); transform: translateY(-3px) scale(1.04); }
    .tile:active { transform: scale(.97); }
    .badge { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
    .name { font-size: 11.5px; line-height: 1.2; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
    .empty { margin: auto; color: var(--secondary); font-size: 13px; text-align: center; }
    .hint { font-size: 11px; color: var(--secondary); text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="dock">
    <div id="rows" class="rows"><p class="empty">Looking for windows…</p></div>
    <div class="hint">Click a window to bring it here · Esc to close</div>
  </div>
  <script src="theme.js"></script>
  <script src="dock.js"></script>
</body>
</html>
